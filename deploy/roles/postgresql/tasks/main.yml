- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
    state: present

- name: Make sure PostgreSQL is running
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

# PostgreSQL listens on localhost only by default, which is what a single-server setup wants.
- name: Create the database user
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
  become: true
  become_user: postgres
  no_log: true

- name: Create the database
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
    encoding: UTF8
  become: true
  become_user: postgres
