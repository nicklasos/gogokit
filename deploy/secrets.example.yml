# Copy to group_vars/all/secrets.yml (not committed) and replace every value.
# Generate each one with:  openssl rand -hex 32
#
# To keep the file in git anyway, encrypt it:  ansible-vault encrypt group_vars/all/secrets.yml

# Password of the application's PostgreSQL user
db_password: CHANGE_ME

# Signs access tokens. At least 32 characters; the API refuses a weak one in production.
jwt_secret: CHANGE_ME

# Password of the monitoring dashboard at /_pulse. Leave empty to turn the dashboard off.
pulse_password: CHANGE_ME

# SMTP password. Leave empty when mail_host is not set.
mail_password: ""
