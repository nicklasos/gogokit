; Example for a server set up by hand (see ../MANUAL_INSTALL.md).
; Copy to /etc/supervisor/conf.d/myapp.conf, then: supervisorctl update
;
; There is no cron program: with ENABLE_SCHEDULER=true in backend/.env the API runs the
; scheduled jobs itself.

[program:myapp-api]
command=/var/www/myapp/backend/bin/api
directory=/var/www/myapp/backend
user=www-data
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/myapp/api.log
stderr_logfile=/var/log/myapp/api-error.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
stopsignal=TERM
; The API finishes in-flight requests for up to 20 seconds before it exits
stopwaitsecs=30
